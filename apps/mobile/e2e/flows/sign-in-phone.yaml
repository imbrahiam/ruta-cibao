# Sign in with a demo phone from the Account tab, complete the profile step
# if it appears, and land signed in. Run with:
#   maestro test -e PHONE=8095550106 -e CODE=<LOCAL_DEMO_OTP> apps/mobile/e2e/flows/sign-in-phone.yaml
appId: do.rutacibao.app.dev
---
- tapOn: "Cuenta"
- tapOn:
    id: "account-sign-in"
- tapOn:
    id: "sign-in-phone"
- inputText: ${PHONE}
- tapOn:
    id: "sign-in-send"
- extendedWaitUntil:
    visible:
      id: "sign-in-code"
    timeout: 10000
- inputText: ${CODE}
- runFlow:
    when:
      visible: "Bienvenido"
    commands:
      - tapOn:
          id: "profile-name"
      - inputText: "Prueba Maestro"
      - tapOn: "Sabaneta"
      - tapOn:
          id: "profile-save"
- extendedWaitUntil:
    visible:
      id: "account-header"
    timeout: 10000
