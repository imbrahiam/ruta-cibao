# Local stack and VPS deployment target.
#
#   docker compose -f infra/docker-compose.yml up -d
#       Postgres and object storage only — what `bun run dev` on the host needs.
#
#   docker compose -f infra/docker-compose.yml --profile full up -d
#       The whole thing behind Caddy, the way the VPS runs it.
#
# Everything is driven by the root .env, so the same file describes both.

name: ruta-cibao

# Bound the log a container can leave behind. Without this, Docker's json-file
# driver grows in /var/lib/docker until the disk fills and takes Postgres with
# it. Ten megabytes per file and five files is enough to investigate an
# incident and small enough to ignore.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Built locally: no published image carries PostGIS and pgvector together.
    build:
      context: ./postgres
    image: ruta-cibao/postgres:18-postgis3.6-pgvector
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ruta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruta}
      POSTGRES_DB: ${POSTGRES_DB:-ruta_cibao}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images want the mount one level up from the old
      # `/data` convention: they store the cluster in a major-version
      # subdirectory so `pg_upgrade --link` can work across versions
      # without crossing a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruta} -d ${POSTGRES_DB:-ruta_cibao}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Object storage for photos and PDFs: SeaweedFS speaking the S3 API.
  #
  # Not MinIO, which this file used until its images stopped being published —
  # `minio/minio` and `quay.io/minio/minio` both refuse anonymous pulls now, so
  # a fresh server could not have started the stack at all. SeaweedFS is
  # Apache-2.0, maintained, and implements the parts of S3 the app uses:
  # presigned PUT and GET, HEAD, ranged reads and bucket CORS.
  #
  # One identity, the app's: the same S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
  # the app signs with, so there is a single credential to rotate. The config
  # file is written on start from those two values and never touches the disk
  # volume.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec /entrypoint.sh server -dir=/data -s3 -s3.port=9000
        -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot: creates the bucket, private, and allows the app's origin to
  # upload to it. Harmless when the deployment stores objects elsewhere (R2,
  # S3): it only touches the local store, which then simply goes unused.
  # Re-running it is a no-op apart from re-applying the CORS rule.
  storage-init:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: storage-init
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${S3_ENDPOINT:-http://storage:9000}
      S3_BUCKET: ${S3_BUCKET:-ruta-cibao}
      # Phones upload straight to storage, so the browser's origin has to be
      # allowed. `*` keeps development on a LAN address working; a deployment
      # sets its own https origin.
      CORS_ORIGIN: ${STORAGE_CORS_ORIGIN:-*}
    depends_on:
      storage:
        condition: service_healthy

  # One-shot: creates the extensions and applies pending migrations, then exits.
  # Re-running it on an up-to-date database is a no-op.
  migrate:
    profiles: ["full", "migrate"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: migrator
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ruta}:${POSTGRES_PASSWORD:-ruta}@postgres:5432/${POSTGRES_DB:-ruta_cibao}
      # So `seed-demo.ts` refuses to run here, as it should on a server.
      NODE_ENV: production
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      # Next inlines `NEXT_PUBLIC_*` into the client bundle, so these have to be
      # present at build time — passing them at runtime would leave the browser
      # with `undefined`. Interpolated from the root `.env`, which is why the
      # documented command passes `--env-file .env`.
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_IOS_URL: ${NEXT_PUBLIC_IOS_URL:-}
        NEXT_PUBLIC_ANDROID_URL: ${NEXT_PUBLIC_ANDROID_URL:-}
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ruta}:${POSTGRES_PASSWORD:-ruta}@postgres:5432/${POSTGRES_DB:-ruta_cibao}
      # Pinned here because `environment` beats `env_file`: a `.env` copied
      # from `.env.example` says `development`, which turned the service worker
      # off and wrote sign-in codes to the log on a production server.
      NODE_ENV: production
    env_file: [../.env]
    expose:
      - "3000"
    depends_on:
      # Not just "Postgres is up": the schema has to exist before the first
      # request, or a fresh deployment answers its first visitors with 500s.
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1001,gid=1001,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The background worker. Its own container so a slow job never shares a
  # process with the one answering requests — and so the app can be scaled to
  # several instances without each of them racing the same cron.
  #
  # It owns the pg-boss schema: it is the only service that migrates it, which
  # is what stops a rolling deploy running two migrations at once.
  worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ruta}:${POSTGRES_PASSWORD:-ruta}@postgres:5432/${POSTGRES_DB:-ruta_cibao}
      # APP_URL comes from `.env` unchanged: it is the public origin, and the
      # links in the emails this worker sends have to be ones a resident can
      # open. PDFs are drawn with pdf-lib, so nothing here calls the app.
      NODE_ENV: production
    env_file: [../.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["full"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set to your domain on the VPS; localhost keeps TLS off in development.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # Let's Encrypt sends certificate warnings here. Set it on the VPS.
      ACME_EMAIL: ${ACME_EMAIL:-ops@localhost.invalid}
      # The public address of the self-hosted object store, when photos are
      # stored there. Unused (and harmless) with R2 or S3.
      STORAGE_ADDRESS: ${STORAGE_ADDRESS:-storage.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Maintenance CLI uses the same local S3 credentials as storage-init.
  storage-tools:
    profiles: ["maintenance"]
    image: amazon/aws-cli:2.37.9
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${S3_ENDPOINT:-http://storage:9000}
      S3_BUCKET: ${S3_BUCKET:-ruta-cibao}
    volumes:
      - ${BACKUP_MOUNT:-../backups}:/backups

volumes:
  postgres-data:
  storage-data:
  caddy-data:
  caddy-config:
