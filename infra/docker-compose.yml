# Local stack and VPS deployment target.
#
#   docker compose -f infra/docker-compose.yml up -d
#       Postgres and MinIO only — what `bun run dev` on the host needs.
#
#   docker compose -f infra/docker-compose.yml --profile full up -d
#       The whole thing behind Caddy, the way the VPS runs it.
#
# Everything is driven by the root .env, so the same file describes both.

name: ruta-cibao

services:
  postgres:
    # Built locally: no published image carries PostGIS and pgvector together.
    build:
      context: ./postgres
    image: ruta-cibao/postgres:18-postgis3.6-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ruta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruta}
      POSTGRES_DB: ${POSTGRES_DB:-ruta_cibao}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images want the mount one level up from the old
      # `/data` convention: they store the cluster in a major-version
      # subdirectory so `pg_upgrade --link` can work across versions
      # without crossing a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruta} -d ${POSTGRES_DB:-ruta_cibao}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the extensions and applies pending migrations, then exits.
  # Re-running it on an up-to-date database is a no-op.
  migrate:
    profiles: ["full", "migrate"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ruta}:${POSTGRES_PASSWORD:-ruta}@postgres:5432/${POSTGRES_DB:-ruta_cibao}
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      # Next inlines `NEXT_PUBLIC_*` into the client bundle, so these have to be
      # present at build time — passing them at runtime would leave the browser
      # with `undefined`. Interpolated from the root `.env`, which is why the
      # documented command passes `--env-file .env`.
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAP_RENDERER: ${NEXT_PUBLIC_MAP_RENDERER:-google}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
        NEXT_PUBLIC_BASEMAP_PMTILES_URL: ${NEXT_PUBLIC_BASEMAP_PMTILES_URL:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ruta}:${POSTGRES_PASSWORD:-ruta}@postgres:5432/${POSTGRES_DB:-ruta_cibao}
    env_file: [../.env]
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The background worker. Its own container because a weekly PDF render holds
  # a headless browser for tens of seconds, which has no business inside the
  # process serving map tiles — and because the app can be scaled to several
  # instances without three of them racing the same cron.
  #
  # It owns the pg-boss schema: it is the only service that migrates it, which
  # is what stops a rolling deploy running two migrations at once.
  worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ruta}:${POSTGRES_PASSWORD:-ruta}@postgres:5432/${POSTGRES_DB:-ruta_cibao}
      # The worker renders the report page over HTTP, so it needs to be able to
      # reach the app by its service name rather than by the public origin.
      APP_URL: http://app:3000
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["full"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set to your domain on the VPS; localhost keeps TLS off in development.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
