# The stack on a server that already has an edge proxy and managed object storage.
#
#   docker compose -f infra/docker-compose.vps.yml --env-file .env up -d --build
#
# With RUTA_TAG set, `pull` fetches the images CI published for that commit instead of building
# here (see .github/workflows/deploy.yml and scripts/ops/deploy-vps.sh).
#
# Differs from docker-compose.yml's `full` profile in three ways, each because of the host:
# - no Caddy: the host's own proxy holds ports 80 and 443 and reaches `app` over EDGE_NETWORK;
# - no SeaweedFS: S3_* in .env point at managed storage (Cloudflare R2), so nothing is published
#   on the host's port 9000;
# - Postgres publishes no port: other stacks on the host own 5432.

name: ruta-cibao-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    build:
      context: ./postgres
    image: ruta-cibao/postgres:18-postgis3.6-pgvector
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${RUTA_REGISTRY:-ruta-cibao}/migrator:${RUTA_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: migrator
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    <<: *hardened
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${RUTA_REGISTRY:-ruta-cibao}/app:${RUTA_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_IOS_URL: ${NEXT_PUBLIC_IOS_URL:-}
        NEXT_PUBLIC_ANDROID_URL: ${NEXT_PUBLIC_ANDROID_URL:-}
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    env_file: [../.env]
    expose:
      - "3000"
    networks:
      default:
      edge:
        # The name the host's proxy forwards to.
        aliases: [ruta-cibao-app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1001,gid=1001,mode=0755
    <<: *hardened

  worker:
    image: ${RUTA_REGISTRY:-ruta-cibao}/worker:${RUTA_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    env_file: [../.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardened

networks:
  edge:
    name: ${EDGE_NETWORK:-web}
    external: true

volumes:
  postgres-data:
