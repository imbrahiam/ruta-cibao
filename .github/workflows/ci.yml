name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://ruta:ruta@localhost:5432/ruta_cibao
      BETTER_AUTH_SECRET: ci-secret-value-that-is-long-enough-000
      BETTER_AUTH_URL: http://localhost:3000
      JCE_API_URL: http://localhost:9999
      # CI never calls the real registry: the lookup quota is 50/hour globally.
      JCE_API_KEY: unused-in-ci
      JCE_USE_MOCK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Built rather than pulled as a service container: no published image
      # carries PostGIS and pgvector together, and CI should exercise the same
      # database image that development and production run.
      - name: Start Postgres
        run: |
          docker build -t ruta-cibao-postgres infra/postgres
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=ruta -e POSTGRES_PASSWORD=ruta -e POSTGRES_DB=ruta_cibao \
            ruta-cibao-postgres
          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -U ruta -d ruta_cibao && exit 0
            sleep 2
          done
          echo "::error::Postgres did not become ready"
          docker logs postgres
          exit 1

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Migrations apply cleanly
        run: bun run db:migrate

      - name: Migrations are up to date with the schema
        run: |
          bun run db:generate
          if ! git diff --quiet -- drizzle; then
            echo "::error::drizzle/ is out of date. Run 'bun run db:generate' and commit the result."
            git diff --stat -- drizzle
            exit 1
          fi

      - name: Build
        run: bun run build

  docker:
    name: Image builds and passes droast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint the Dockerfile
        uses: docker://ghcr.io/immanuwell/droast:1.6.1
        with:
          args: infra/Dockerfile --no-roast --format compact

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
