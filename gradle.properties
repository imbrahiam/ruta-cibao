org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Local API origin for debug builds; the emulator reaches the host at 10.0.2.2.
ruta.apiOrigin=http://10.0.2.2:3000
# Google Maps SDK key for the Android map. Leave empty in git; set it in ~/.gradle/gradle.properties
# or pass -Pruta.googleMapsKey=... Without it the map screen shows an unavailable state.
ruta.googleMapsKey=
